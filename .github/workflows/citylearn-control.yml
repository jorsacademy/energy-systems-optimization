name: CityLearn Control Core
on:
  pull_request:
    paths: ["projects/citylearn-building-energy-control/**",".github/workflows/citylearn-control.yml"]
  push:
    branches: [main]
    paths: ["projects/citylearn-building-energy-control/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/citylearn-building-energy-control
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
